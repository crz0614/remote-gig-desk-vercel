name: Canonical Portfolio Boundary
on:
  push:
    paths: ["portfolio-projects/**", ".github/workflows/portfolio-ci.yml"]
  pull_request:
    paths: ["portfolio-projects/**", ".github/workflows/portfolio-ci.yml"]
permissions: { contents: read }
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject embedded copies of canonical repositories
        run: |
          if find portfolio-projects -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Canonical portfolio projects must live in their own repositories."
            find portfolio-projects -type f -print
            exit 1
          fi
