name: Archived Portfolio Snapshot Check
on:
  push:
    paths: ["portfolio-projects/**", ".github/workflows/portfolio-ci.yml"]
  pull_request:
    paths: ["portfolio-projects/**", ".github/workflows/portfolio-ci.yml"]
permissions: { contents: read }
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify snapshots are explicitly retired
        run: |
          test -f portfolio-projects/README.md
          grep -q "Archived snapshots" portfolio-projects/README.md
          grep -q "ai-freelance-workbench" portfolio-projects/README.md
          grep -q "multilingual-support-copilot" portfolio-projects/README.md
          grep -q "distributed-job-runner" portfolio-projects/README.md
