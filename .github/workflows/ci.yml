name: CI

on:
  push:
    branches: [main]
    paths:
      - "remote-gig-desk-vercel/**"
      - "browser-agent-extension/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "remote-gig-desk-vercel/**"
      - "browser-agent-extension/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: remote-gig-desk-vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remote-gig-desk-vercel/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run behavior tests
        run: node --test tests/*.test.mjs
      - name: Production build
        run: npm run build
